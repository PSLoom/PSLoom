name: CI

on:
  push:
    branches: [main, develop]
    tags: ['psloom/v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed for versioning

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PSLoom.slnx

      - name: Build
        run: dotnet build PSLoom.slnx --configuration Release --no-restore

      # Includes the published-module integration tests, which start real pwsh processes against artifacts/modules.
      - name: Test
        run: dotnet test --solution PSLoom.slnx --configuration Release --no-build

      # Import < 50 ms and the typical draft < 150 ms, medians of cold processes (section 6 of the design).
      - name: Startup budgets
        shell: pwsh
        run: ./benchmarks/Measure-Startup.ps1 -DraftPath ./benchmarks/drafts/typical.ps1 -AllowHarness Fixture

      # The same profile with nothing staged, reported next to the gated one: the difference is what Shed buys.
      - name: Eager draft (report only)
        shell: pwsh
        run: ./benchmarks/Measure-Startup.ps1 -DraftPath ./benchmarks/drafts/eager.ps1 -AllowHarness Fixture -ReportOnly

      - name: Verify packed SDK
        shell: pwsh
        run: |
          $version = "0.0.0-local.$env:GITHUB_RUN_ID.$env:GITHUB_RUN_ATTEMPT"
          ./build/Pack-Local.ps1 -Output artifacts/packages -Version $version
          ./build/Test-BuildSdk.ps1 -Directory artifacts/packages -Version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  benchmarks:
    # One OS only: shared runners are noisy and BenchmarkDotNet is slow; the budgets are orders of magnitude apart from noise.
    name: benchmark budgets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run budgeted benchmarks
        run: >-
          dotnet run --configuration Release --project benchmarks/PSLoom.Benchmarks --
          --filter '*StyleResolveBenchmarks*' '*HookDispatchBenchmarks*'
          --exporters json

      - name: Check budgets
        shell: pwsh
        run: ./benchmarks/Assert-Budgets.ps1

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/results

  publish:
    name: publish packages
    if: startsWith(github.ref, 'refs/tags/psloom/v')
    needs: [build, benchmarks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack
        shell: pwsh
        run: |
          $projects = 'src/Warp/Warp.csproj', 'src/PSLoom.Build/PSLoom.Build.csproj', 'tests/PSLoom.TestKit/PSLoom.TestKit.csproj', 'src/PSLoom/PSLoom.csproj'
          foreach ($project in $projects) {
            dotnet pack $project --configuration Release --output artifacts/packages
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $version = '${{ github.ref_name }}'.Substring('psloom/v'.Length)
          ./build/Test-Packages.ps1 -Directory artifacts/packages -Version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/Test-BuildSdk.ps1 -Directory artifacts/packages -Version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Push
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source https://nuget.pkg.github.com/PSLoom/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
