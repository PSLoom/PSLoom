name: Release

# A tag v<version> builds the module and attaches it to a GitHub release. A plain MAJOR.MINOR.PATCH version
# is also published to the PowerShell Gallery; a version with a pre-release suffix only gets the GitHub
# release.
#
# It also starts by dispatch, which is how prepare-release.yml starts it: a tag pushed by a workflow does not
# start another workflow. A dispatch has to be on the tag; on a branch, the first job fails.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: The tag matches the version of the repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: |
          version="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' Version.props)"
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Run this on the tag v$version: it ran on the $GITHUB_REF_TYPE $GITHUB_REF_NAME."
            exit 1
          fi

  github:
    name: GitHub release
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Install the PowerShell the module is built for
        run: |
          version="$(sed -n 's/.*Include="System.Management.Automation" Version="\([^"]*\)".*/\1/p' eng/build/Packages.props)"
          dotnet tool install --global PowerShell --version "$version"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - run: dotnet restore --locked-mode

      - run: dotnet build --no-restore --configuration Release

      - run: dotnet test --no-build --configuration Release

      - name: Pack the modules
        run: |
          mkdir -p release-artifacts
          cd artifacts/modules
          for module in */; do
            zip -r "../../release-artifacts/${module%/}-${GITHUB_REF_NAME#v}.zip" "$module"
          done

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in
            *-*) flags+=(--prerelease) ;;
          esac
          # The notes are the section of the version in the changelog. A tag pushed by hand for a version
          # the changelog does not have falls back to generated notes.
          if pwsh -NoProfile -File eng/Get-ChangelogSection.ps1 -Version "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"; then
            flags+=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            flags+=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" release-artifacts/*.zip --verify-tag "${flags[@]}"

  psgallery:
    name: PowerShell Gallery
    needs: github
    # Pre-releases stay on GitHub. The variable keeps the Gallery closed until the owner opens it.
    if: ${{ !contains(github.ref_name, '-') && vars.PUBLISH_PSGALLERY == 'true' }}
    runs-on: ubuntu-24.04
    environment: psgallery
    permissions:
      contents: read
    steps:
      - name: Download the modules of the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir release-artifacts
          mkdir -p modules
          for archive in release-artifacts/*.zip; do
            unzip -o "$archive" -d modules
          done

      - name: Publish
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          pwsh -NoProfile -NonInteractive -Command '
            $ErrorActionPreference = "Stop"
            foreach ($module in Get-ChildItem -LiteralPath modules -Directory) {
              Publish-PSResource -Path $module.FullName -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY
            }'
